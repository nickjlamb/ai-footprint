  <text x="148" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="600" letter-spacing="-1" fill="#e8ecf1">AI Footprint</text>
  <text x="150" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#93a1b3">How much water and energy does AI use? Answers with the boundary, assumptions and sources attached.</text>
  <rect x="64" y="196" width="236" height="72" rx="10" fill="rgba(95,196,192,0.10)" stroke="#223047"/><text x="82" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#e8ecf1">0.34 Wh</text><text x="82" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#93a1b3">energy per text prompt</text><rect x="316" y="196" width="236" height="72" rx="10" fill="rgba(95,196,192,0.10)" stroke="#223047"/><text x="334" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#e8ecf1">~1.4 mL</text><text x="334" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#93a1b3">water per prompt, full boundary</text><rect x="568" y="196" width="236" height="72" rx="10" fill="rgba(95,196,192,0.10)" stroke="#223047"/><text x="586" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#e8ecf1">4 tools</text><text x="586" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#93a1b3">MCP + JSON API, no key</text>
  <text x="1216" y="236" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="1.5" fill="#5fc4c0">MCP SERVER · JSON API</text>
  <text x="1216" y="258" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="1.5" fill="#93a1b3">methodology 2026-10</text>
