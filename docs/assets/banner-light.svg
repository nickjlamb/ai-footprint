  <text x="150" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#6b7b8d">How much water and energy does AI use? Answers with the boundary, assumptions and sources attached.</text>
  <rect x="64" y="196" width="236" height="72" rx="10" fill="rgba(13,115,119,0.07)" stroke="#e2e5ea"/><text x="82" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#0f1a2e">0.34 Wh</text><text x="82" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7b8d">energy per text prompt</text><rect x="316" y="196" width="236" height="72" rx="10" fill="rgba(13,115,119,0.07)" stroke="#e2e5ea"/><text x="334" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#0f1a2e">~1.4 mL</text><text x="334" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7b8d">water per prompt, full boundary</text><rect x="568" y="196" width="236" height="72" rx="10" fill="rgba(13,115,119,0.07)" stroke="#e2e5ea"/><text x="586" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#0f1a2e">4 tools</text><text x="586" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7b8d">MCP + JSON API, no key</text>
