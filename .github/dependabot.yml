version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
